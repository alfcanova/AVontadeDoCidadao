{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>Alterar Senha (1º Acesso)</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label>Nova Senha</label><input type="password" name="nova" required minlength="4"></div>
    <div class="form-group"><label>Confirmar</label><input type="password" name="conf" required minlength="4"></div>
    <button class="btn">Salvar</button>
  </form>
</div>
{% endblock %}
