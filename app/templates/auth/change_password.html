{% extends 'base.html' %}
{% block content %}
<div class="card pwd-form" style="max-width:420px;margin:0 auto">
  <h2 style="text-align:center">1º Acesso do admin<br>Alteração Obrigatória da Senha</h2>
  <form method="post" id="frmChg">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label>Nova Senha</label><input type="password" name="nova" id="nova" required minlength="4"></div>
    <div class="form-group"><label>Confirmar</label><input type="password" name="conf" id="conf" required minlength="4"><small class="field-error" id="conf_error">As senhas não conferem. Digite novamente.</small></div>
    <div class="form-actions"><button class="btn">Salvar</button></div>
  </form>
</div>
{% endblock %}
{% block js %}
<script>
const nova=document.getElementById('nova'), conf=document.getElementById('conf');
const confError=document.getElementById('conf_error');
function checaIgual(){ const ok=nova.value===conf.value; confError.classList.toggle('show',!ok && (nova.value!==''||conf.value!=='')); return ok; }
conf.addEventListener('blur',()=>{ if(!checaIgual()){ conf.value=''; conf.focus(); } });
conf.addEventListener('input',()=>confError.classList.remove('show'));
nova.addEventListener('input',()=>confError.classList.remove('show'));
document.getElementById('frmChg').addEventListener('submit',e=>{
  if(!checaIgual()){
    e.preventDefault();
    conf.value=''; conf.focus();
    alert('As senhas digitadas são diferentes. Digite novamente a confirmação.');
  }
});
</script>
{% endblock %}
