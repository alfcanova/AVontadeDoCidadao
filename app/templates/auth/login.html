{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>Login</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group"><label>Usuário ou E-mail</label><input name="ident" required></div>
    <div class="form-group"><label>Senha</label><input type="password" name="senha" required></div>
    <button class="btn">Entrar</button>
  </form>
  <p><a href="{{ url_for('auth.register') }}">Cadastrar</a></p>
</div>
{% endblock %}
